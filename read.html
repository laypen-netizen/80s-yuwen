<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="description" content="人教版80年代小学语文课本（六年制）在线阅读——怀旧、清晰的数字化重现。">
<meta name="keywords" content="80年代小学语文,人教版,怀旧,童年回忆,课本">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta property="og:type" content="website">
<meta property="og:title" content="80年代小学语文课本 — 在线阅读">
<meta property="og:description" content="人教版80年代小学语文课本（六年制）在线阅读——怀旧、清晰的数字化重现。">
<meta property="og:image" content="https://laypen-netizen.github.io/80s-yuwen/covers/v01.jpg?v=3">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self';">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>课本阅读 · 80年代小学语文</title>
<style>
  :root { --bg:#f7f5f0; --ink:#3a352e; --muted:#8a857d; --accent:#c45b28; --accent-hover:#a3481e; --card-bg:#fff; --radius:10px; --shadow:0 2px 8px rgba(0,0,0,0.06); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--card-bg); border-bottom:1px solid #ece9e3; position:sticky; top:0; z-index:10; }
  header .left { display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; font-weight:600; margin:0; }
  header small { font-size:12px; color:var(--muted); }
  .btn { border:1px solid #ddd; background:var(--card-bg); color:var(--ink); padding:5px 10px; border-radius:6px; font-size:13px; cursor:pointer; touch-action:manipulation; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .viewer { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; padding:8px; }
  .viewer img#pageImg { display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; border-radius:4px; background:#e8e6e1; box-shadow:0 4px 12px rgba(0,0,0,.06); }
  .viewer img.page-in { animation:pageIn .18s ease-out; }
  @keyframes pageIn { from { opacity:.25; } to { opacity:1; } }
  .viewer img#coverPlaceholder { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); max-width:50%; max-height:60%; object-fit:contain; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.12); opacity:.6; transition:opacity .2s ease; }
  .viewer img#coverPlaceholder.hidden { opacity:0; pointer-events:none; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .overlay.hidden { display:none; }
  .msg { background:rgba(255,255,255,.92); padding:10px 18px; border-radius:999px; font-size:13px; color:#6b6256; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .tap-zone { position:absolute; top:0; bottom:0; width:22%; z-index:5; cursor:pointer; }
  .tap-zone.left { left:0; }
  .tap-zone.right { right:0; }
  .controls { display:flex; align-items:center; justify-content:center; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--card-bg); border-top:1px solid #ece9e3; flex-wrap:wrap; }
  .controls .btn { min-width:56px; text-align:center; }
  .page-info { font-size:13px; color:var(--muted); min-width:80px; text-align:center; }
  input[type="range"] { flex:1; min-width:120px; max-width:320px; accent-color:var(--accent); }
  @media (max-width:420px) {
    header h1 { font-size:15px; }
    .viewer { padding:4px; }
    .controls { gap:6px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
    .page-info { min-width:64px; }
  }
</style>
</head>
<body>
<header>
  <div class="left">
    <a class="btn" href="index.html">返回</a>
    <div>
      <h1 id="vTitle">第一册</h1>
      <small id="vSub">一年级 上学期</small>
    </div>
  </div>
  <div style="display:flex;gap:6px;">
    <button class="btn" id="btnFitWidth" title="适应宽度">适应宽度</button>
    <button class="btn" id="btnFitPage" title="整页显示">整页</button>
  </div>
</header>
<div class="viewer" id="viewer">
  <img id="pageImg" alt="课本页面">
  <img id="coverPlaceholder" alt="">
  <div class="overlay" id="overlay"><div class="msg" id="msg">正在加载课本扫描件…</div></div>
  <div class="tap-zone left" id="tapLeft" aria-hidden="true"></div>
  <div class="tap-zone right" id="tapRight" aria-hidden="true"></div>
</div>
<div class="controls">
  <button class="btn" id="btnPrev">上一页</button>
  <span class="page-info" id="pageInfo">1 / 61</span>
  <input type="range" id="pageSlider" min="1" max="61" value="1" aria-label="页码滑块">
  <button class="btn" id="btnNext">下一页</button>
</div>
<script src="js/volumes.js"></script>
<script src="js/read-img.js"></script>
</body>
</html>
