<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>页面找不到了 · 80年代小学语文课本</title>
<meta name="robots" content="noindex">

<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f7f1e3; color: #2d2a24;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  .box { text-align: center; padding: 40px 24px; }

  .msg { color: #6b6357; margin: 8px 0 28px; }
  a.back {
    display: inline-block; text-decoration: none; color: #fff; background: #c0392b;
    padding: 8px 22px; border-radius: 999px; letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="box">
  <p class="code">404</p>
  <p class="msg">这一页，好像被撕去做纸飞机了。</p>
  <a class="back" href="/">回到目录</a>

</html>
